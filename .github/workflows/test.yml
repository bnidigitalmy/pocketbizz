name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pocketbizz_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # - name: Run type checking
      #   run: npm run check

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/pocketbizz_test
          SESSION_SECRET: test-secret-key-for-ci
          NODE_ENV: test
        run: npm test

      - name: Generate coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/pocketbizz_test
          SESSION_SECRET: test-secret-key-for-ci
          NODE_ENV: test
        run: npm run test:coverage

      - name: Upload coverage to artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
