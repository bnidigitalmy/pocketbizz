name: Weekly Database Backup

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="pocketbizz_weekly_${TIMESTAMP}.sql"
          
          echo "Creating backup: ${BACKUP_FILE}"
          pg_dump "$DATABASE_URL" > "${BACKUP_FILE}"
          
          echo "Compressing backup..."
          gzip "${BACKUP_FILE}"
          
          echo "Backup size:"
          ls -lh "${BACKUP_FILE}.gz"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_number }}
          path: pocketbizz_weekly_*.sql.gz
          retention-days: 90

      - name: Verify backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Verifying database connection..."
          psql "$DATABASE_URL" -c "SELECT COUNT(*) as user_count FROM users;"
          psql "$DATABASE_URL" -c "SELECT COUNT(*) as product_count FROM products;"
          echo "✅ Database verification completed"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Weekly backup failed!"
          echo "Please check the workflow logs and investigate immediately."
