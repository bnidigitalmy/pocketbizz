<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1ED9C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B8D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Pocket/Pouch shape with rounded top and smile inside -->
  <path d="M 8 15 
           C 8 10 12 8 16 8
           L 40 8
           C 44 8 48 10 48 15
           L 48 38
           C 48 46 40 52 28 52
           C 16 52 8 46 8 38
           Z" 
        fill="url(#logoGradient)"/>
  
  <!-- Smile curve inside pocket -->
  <path d="M 18 32 Q 28 38 38 32" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Small pocket opening hint at top -->
  <path d="M 20 10 L 20 14 M 36 10 L 36 14" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Text: PocketBizz -->
  <text x="60" y="38" font-family="Poppins, sans-serif" font-size="24" font-weight="700" fill="#2D3748">
    Pocket<tspan fill="url(#logoGradient)">Bizz</tspan>
  </text>
</svg>
